[pytest]
testpaths = tests
pythonpath = app tests

# Run across all cores by default. --dist=loadscope keeps every test in a
# class on one worker, which the integration suite depends on: its cleanup
# fixture reverts and clears all corrections, so tests sharing a database must
# not interleave. Each xdist worker also clones the seeded database into its
# own copy (ha_test_gw0, ha_test_gw1, …) for the same reason.
#
# To debug a single failure, turn parallelism off with -n0 — worker output
# interleaves and tracebacks are easier to read serially.
addopts = -n auto --dist=loadscope

# Per-test timeout. Most tests are sub-second; the ceiling is set above the
# 5-second innodb_lock_wait_timeout that the lock-contention integration test
# deliberately waits out.
timeout = 120
