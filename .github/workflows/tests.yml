name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # test_browser.py drives both engines (chromium for most of the suite,
      # webkit for a handful of Safari-specific regressions) — without this,
      # every one of those ~110 tests fails immediately with "browser not
      # found", not a real test failure.
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium webkit

      - name: Ruff check
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Mypy
        run: mypy app/

      - name: Vulture
        run: vulture app/ --min-confidence 80

      - name: Bandit
        run: bandit -r app/

      - name: Run test suite
        run: pytest -n auto --dist=loadscope --cov=app --cov-report=term-missing

  docker:
    name: App image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The app is installed by Supervisor building this Dockerfile on the
      # user's own device, so a build failure is a failure to install. Both
      # architectures in config.yaml are built: amd64 natively, and aarch64
      # under emulation for the ARM boards most Home Assistant installs run on.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: BUILD_ARCH=amd64
          push: false

      - name: Build aarch64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: BUILD_ARCH=aarch64
          push: false
